<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Unique Earn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Jakarta Sans', sans-serif; background-color: #f1f5f9; color: #334155; }
        .app-input { transition: all 0.2s; border: 1px solid #e2e8f0; background: #fff; }
        .app-input:focus { border-color: #00a0e9; outline: none; }
        .btn-flat { background: #00a0e9; color: #fff; border: none; transition: all 0.2s; }
        .btn-flat:active { transform: scale(0.97); background: #008cc9; }
        .flat-alert { padding: 10px 15px; border-radius: 12px; font-size: 13px; font-weight: 600; margin-bottom: 15px; border: 1px solid #fecaca; background: #fef2f2; color: #b91c1c; text-align: center; }
        .animate-fade-up { animation: fadeUp 0.4s ease-out; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex flex-col items-center justify-start min-h-screen pt-12 px-4">

    <div class="flex bg-white p-1 rounded-full w-full max-w-[280px] mb-8 border border-gray-100 animate-fade-up">
        <button class="flex-1 py-2.5 bg-[#00a0e9] text-white font-bold text-xs rounded-full transition-all shadow-md">Log In</button>
        <a href="register.html" class="flex-1 py-2.5 text-slate-500 font-semibold text-xs text-center rounded-full transition-all">Sign Up</a>
    </div>

    <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-sm border border-gray-100 animate-fade-up">
        
        <div class="text-center mb-8">
            <div class="h-14 w-14 bg-slate-50 text-[#00a0e9] rounded-2xl flex items-center justify-center text-2xl mx-auto mb-3 border border-slate-100"><i class="fas fa-user-shield"></i></div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Welcome Back</h1>
            <p class="text-slate-400 text-xs mt-1 font-medium">Login to access your dashboard</p>
        </div>

        <div id="alertBox" class="hidden"></div>
                
        <form id="loginForm" class="space-y-4">
            <div class="relative group">
                <input type="email" id="email" placeholder="Email Address" required
                       class="w-full app-input rounded-2xl py-4 px-5 pl-12 text-sm font-semibold placeholder:text-slate-400">
                <i class="far fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-[#00a0e9] text-lg"></i>
            </div>

            <div class="relative group">
                <input type="password" id="password" placeholder="Password" required
                       class="w-full app-input rounded-2xl py-4 px-5 pl-12 pr-12 text-sm font-semibold placeholder:text-slate-400">
                <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-[#00a0e9] text-lg"></i>
                <button type="button" id="togglePassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-[#00a0e9] p-2">
                    <i class="fas fa-eye"></i>
                </button>
            </div>

            <div class="flex items-center justify-between pt-1">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="w-4 h-4 rounded-md border-gray-300 text-[#00a0e9] focus:ring-0">
                    <span class="text-[11px] text-slate-500 font-bold uppercase tracking-wider">Keep me logged in</span>
                </label>
                <a href="#" class="text-[11px] text-[#00a0e9] font-extrabold uppercase tracking-wider">Forgot Password?</a>
            </div>

            <button type="submit" id="submitBtn" class="w-full btn-flat font-bold py-4 rounded-2xl flex items-center justify-center gap-3 mt-4 text-sm tracking-widest shadow-lg shadow-blue-100">
                <span>LOGIN SECURELY</span>
                <i class="fas fa-shield-alt text-xs"></i>
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-slate-400 text-xs font-semibold">New to our platform? 
                <a href="register.html" class="text-[#00a0e9] font-extrabold hover:underline ml-1">Create Account</a>
            </p>
        </div>
    </div>

    <p class="mt-12 text-[10px] text-slate-400 font-bold uppercase tracking-[4px]">Powered by Dev Atik</p>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
  apiKey: "AIzaSyB3kKnSd54IuuBOCyVjzry47q002cMF-zA",
  authDomain: "bdt-php.firebaseapp.com",
  projectId: "bdt-php",
  storageBucket: "bdt-php.firebasestorage.app",
  messagingSenderId: "98854531594",
  appId: "1:98854531594:web:7a3801c1ae6a1817bbe5f3",
  measurementId: "G-VLCRVLP8YP"
};
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Check if already logged in
        auth.onAuthStateChanged(user => {
            if(user) { window.location.href = "dashboard.html"; }
        });

        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash text-[#00a0e9]"></i>';
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.innerText = "Checking...";

            try {
                await auth.signInWithEmailAndPassword(email, password);
                window.location.href = "dashboard.html";
            } catch (error) {
                alertBox.className = "flat-alert";
                alertBox.innerText = "❌ ভুল ইমেইল বা পাসওয়ার্ড!";
                submitBtn.disabled = false;
                submitBtn.innerText = "LOGIN SECURELY";
            }
        });
    </script>
</body>
</html>
