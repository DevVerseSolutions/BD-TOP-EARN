<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পেজ পাওয়া যায়নি - 404 Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #f4f7fe; 
            font-family: 'Poppins', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            padding: 20px;
            color: #1e293b;
        }
        .error-card { 
            text-align: center; 
            padding: 50px 30px; 
            background: #fff; 
            border-radius: 35px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.05); 
            max-width: 500px; 
            width: 100%; 
            border: 1px solid #e2e8f0;
        }
        .floating-icon {
            font-size: 80px;
            color: #00a0e9;
            margin-bottom: 20px;
            animation: floating 3s ease-in-out infinite;
        }
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        .error-code { 
            font-size: 100px; 
            font-weight: 900; 
            background: linear-gradient(135deg, #00a0e9, #6366f1); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            line-height: 0.9; 
            margin-bottom: 20px;
            letter-spacing: -2px;
        }
        h4 { font-weight: 800; color: #1e293b; margin-bottom: 15px; }
        p { color: #64748b; font-size: 14px; margin-bottom: 30px; line-height: 1.6; }
        .btn-group-custom { display: flex; flex-direction: column; gap: 12px; }
        .btn-common {
            padding: 14px;
            border-radius: 16px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }
        .btn-home { 
            background: linear-gradient(90deg, #00a0e9, #6366f1); 
            color: #fff; 
            box-shadow: 0 8px 20px rgba(0, 160, 233, 0.25);
        }
        .btn-dev { 
            background: #fff; 
            color: #0088cc; 
            border: 2px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="floating-icon">
            <i class="fa-solid fa-ghost"></i>
        </div>
        <div class="error-code">404</div>
        <h4>দুঃখিত! পেজটি পাওয়া যায়নি</h4>
        <p>আপনি যে পেজটি খুঁজছেন তা হয়তো ডিলিট করা হয়েছে অথবা ভুল লিঙ্কে ক্লিক করেছেন।</p>
        
        <div class="btn-group-custom">
            <a href="dashboard.html" class="btn-common btn-home">
                <i class="fa-solid fa-house-chimney me-2"></i> ড্যাশবোর্ডে ফিরে যান
            </a>
            <a href="https://t.me/Aether_Forge1" target="_blank" class="btn-common btn-dev">
                <i class="fa-brands fa-telegram me-2"></i> ডেভেলপারের সহায়তা নিন
            </a>
        </div>
        <div class="mt-4 text-muted small fw-bold uppercase">Dev Atik • Hub</div>
    </div>
</body>
</html>
