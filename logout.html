<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging Out... | BD TOP EARN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00b894;
            --secondary: #00897b;
            --accent-red: #ef4444;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .logout-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 25px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        /* Circular Progress Ring */
        .circle-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .progress-ring {
            transform: rotate(-90deg);
        }
        .progress-ring__bg {
            stroke: #f1f5f9;
        }
        .progress-ring__circle {
            stroke: var(--primary);
            transition: stroke-dashoffset 0.05s linear;
            stroke-linecap: round;
        }
        .circle-content {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .percent-text {
            font-size: 26px;
            font-weight: 800;
            color: #1e293b;
            line-height: 1;
        }
        .percent-symbol {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
        }

        /* Titles */
        .logout-title {
            font-size: 18px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 6px;
        }
        .logout-desc {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 0;
            line-height: 1.5;
        }
        .status-badge {
            background: #fef2f2;
            color: #ef4444;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 18px;
        }
    </style>
</head>
<body>

    <div class="logout-card">
        <!-- Status Badge -->
        <div class="status-badge">
            <i class="fa-solid fa-shield-halved"></i>
            <span>নিরাপদ প্রস্থান (Secure Logout)</span>
        </div>

        <!-- 0% - 100% Circular Progress -->
        <div class="circle-container">
            <svg class="progress-ring" width="130" height="130">
                <circle class="progress-ring__bg" stroke-width="10" fill="transparent" r="52" cx="65" cy="65"/>
                <circle id="progressCircle" class="progress-ring__circle" stroke-width="10" fill="transparent" r="52" cx="65" cy="65"/>
            </svg>
            <div class="circle-content">
                <div class="percent-text">
                    <span id="counter">0</span><span class="percent-symbol">%</span>
                </div>
                <i class="fa-solid fa-arrow-right-from-bracket text-secondary mt-1" style="font-size: 12px;"></i>
            </div>
        </div>

        <h5 class="logout-title">লগআউট হচ্ছে...</h5>
        <p class="logout-desc">আপনার সেশন নিরাপদ করতে ডাটা ক্লিয়ার করা হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন।</p>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB3kKnSd54IuuBOCyVjzry47q002cMF-zA",
            authDomain: "bdt-php.firebaseapp.com",
            projectId: "bdt-php",
            storageBucket: "bdt-php.firebasestorage.app",
            messagingSenderId: "98854531594",
            appId: "1:98854531594:web:7a3801c1ae6a1817bbe5f3",
            measurementId: "G-VLCRVLP8YP"
        };
        firebase.initializeApp(firebaseConfig);

        // Circular Progress Ring Setup
        const circle = document.getElementById('progressCircle');
        const radius = circle.r.baseVal.value;
        const circumference = 2 * Math.PI * radius;

        circle.style.strokeDasharray = `${circumference} ${circumference}`;
        circle.style.strokeDashoffset = circumference;

        function setProgress(percent) {
            const offset = circumference - (percent / 100) * circumference;
            circle.style.strokeDashoffset = offset;
        }

        // Counter Animation (১% থেকে ১০০%)
        let count = 0;
        const counterElement = document.getElementById('counter');

        const interval = setInterval(() => {
            count += 1;
            counterElement.innerText = count;
            setProgress(count);

            // ১০০% পূর্ণ হলে লগআউট সম্পন্ন হবে
            if (count >= 100) {
                clearInterval(interval);
                
                // ফায়ারবেস লগআউট এবং রিডাইরেক্ট
                firebase.auth().signOut().then(() => {
                    sessionStorage.clear();
                    localStorage.clear();
                    window.location.href = "login.html";
                }).catch((error) => {
                    console.error("Logout Error:", error);
                    window.location.href = "login.html";
                });
            }
        }, 18); // ১৮ মিলি-সেকেন্ড পর পর বৃদ্ধি পেয়ে প্রায় ১.৮ সেকেন্ডে ১০০% হবে
    </script>
</body>
</html>
