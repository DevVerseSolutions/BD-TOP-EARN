<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD TOP EARN | VIP Plan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary-color: #00b894; 
            --secondary-color: #00897b;
            --accent-yellow: #feca57;
            --vip-gradient: linear-gradient(135deg, #e11d48, #f43f5e);
            --gold-gradient: linear-gradient(135deg, #f59e0b, #d97706);
            --emerald-gradient: linear-gradient(135deg, #10b981, #059669);
            --indigo-gradient: linear-gradient(135deg, #4f46e5, #6366f1);
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #f1f5f9; 
            margin: 0; 
            padding-top: 85px; 
            padding-bottom: 95px; 
        }

        /* Top Bar */
        .top-header { 
            background: var(--primary-color); 
            padding: 14px 20px; 
            border-radius: 0 0 20px 20px; 
            color: white; 
            position: fixed; 
            top: 0; 
            left: 0; 
            right: 0; 
            z-index: 1000; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.06); 
        }
        .back-btn { 
            background: rgba(255, 255, 255, 0.2); 
            color: white; 
            border: none; 
            width: 38px; 
            height: 38px; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1.1rem; 
            text-decoration: none; 
            transition: 0.2s;
        }
        .back-btn:hover { background: rgba(255, 255, 255, 0.3); color: white; }
        .page-title { font-weight: 800; font-size: 1.15rem; margin: 0; letter-spacing: 0.5px; }
        .wallet-pill { 
            background: rgba(0, 0, 0, 0.15); 
            padding: 7px 14px; 
            border-radius: 14px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        .wallet-pill i { color: var(--accent-yellow); font-size: 0.95rem; }
        .wallet-pill span { font-size: 13px; font-weight: 700; color: white; }

        /* Active Plan Banner */
        .current-plan-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #fff;
            padding: 18px;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .cp-left { display: flex; align-items: center; gap: 14px; }
        .cp-icon {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #feca57;
        }
        .cp-info h6 { font-weight: 800; margin: 0; font-size: 15px; }
        .cp-info p { margin: 0; font-size: 12px; color: #94a3b8; font-weight: 600; }

        /* Dynamic Plan Cards */
        .plan-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            margin-top: 16px;
            border: 1px solid #e2e8f0;
            position: relative;
            box-shadow: 0 5px 16px rgba(0,0,0,0.03);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .plan-card:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 10px 24px rgba(0,0,0,0.06);
        }
        .plan-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }
        .badge-indigo { background: #e0e7ff; color: #4338ca; }
        .badge-gold { background: #fef3c7; color: #b45309; }
        .badge-rose { background: #ffe4e6; color: #e11d48; }
        .badge-emerald { background: #d1fae5; color: #065f46; }

        .plan-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .plan-header i { font-size: 22px; }
        .plan-header h5 { font-weight: 900; margin: 0; font-size: 18px; color: #0f172a; }

        .plan-price { font-size: 24px; font-weight: 900; color: #0f172a; margin-bottom: 14px; }
        .plan-price span { font-size: 13px; font-weight: 600; color: #64748b; }

        .feature-list { list-style: none; padding: 0; margin: 0 0 18px 0; }
        .feature-list li { font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .feature-list li i { font-size: 14px; }

        .btn-upgrade {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 800;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #fff;
            transition: 0.2s;
            text-decoration: none;
        }
        .btn-upgrade:active { transform: scale(0.98); }
        .btn-indigo { background: var(--indigo-gradient); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
        .btn-gold { background: var(--gold-gradient); box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); }
        .btn-rose { background: var(--vip-gradient); box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3); }
        .btn-emerald { background: var(--emerald-gradient); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }

        /* Footer Nav */
        .footer-nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            height: 75px; 
            background: #ffffff; 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.05); 
            z-index: 1000; 
            border-top-left-radius: 20px; 
            border-top-right-radius: 20px; 
        }
        .nav-item { 
            text-decoration: none; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: #666666; 
            flex: 1; 
            font-size: 11px; 
            font-weight: 600; 
        }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .home-wrapper { position: relative; width: 60px; display: flex; justify-content: center; }
        .home-btn { 
            position: absolute; 
            top: -35px; 
            width: 56px; 
            height: 56px; 
            background: #00b894; 
            border: 4px solid #f1f5f9; 
            border-radius: 50%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            color: #fff; 
            text-decoration: none; 
            box-shadow: 0 5px 12px rgba(0, 184, 148, 0.3); 
        }
        .home-btn i { font-size: 18px; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="top-header">
        <a href="dashboard.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h6 class="page-title"><i class="fa-solid fa-gem me-1"></i> VIP Membership</h6>
        <div class="wallet-pill">
            <i class="fa-solid fa-wallet"></i>
            <span>৳ <span id="uBalance">0.00</span></span>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container px-3 mt-3">

        <!-- Current Plan Card -->
        <div class="current-plan-card">
            <div class="cp-left">
                <div class="cp-icon">
                    <i class="fa-solid fa-crown"></i>
                </div>
                <div class="cp-info">
                    <h6>বর্তমান প্ল্যান: <span id="curPlanName" class="text-warning">Free Tier</span></h6>
                    <p id="curPlanStatus">কোনো প্রিমিয়াম প্ল্যান সক্রিয় নেই</p>
                </div>
            </div>
            <div id="planActionArea">
                <span class="badge bg-success bg-opacity-25 text-success border border-success border-opacity-25 rounded-pill px-3 py-2 fw-bold" id="badgePlanStatus">ফ্রি মেম্বার</span>
            </div>
        </div>

        <div class="mt-4 mb-2">
            <h6 class="fw-bold text-dark m-0"><i class="fa-solid fa-bolt text-danger me-1"></i> আপগ্রেড প্যাকেজসমূহ</h6>
            <p class="text-muted" style="font-size: 12px; margin-top: 2px;">প্রতিদিন বেশি ইনকাম ও এক্সক্লুসিভ টাস্ক পেতে আপগ্রেড করুন</p>
        </div>

        <!-- ডাইনামিক প্ল্যান লিস্ট (Firebase থেকে অটো লোড হবে) -->
        <div id="dynamicPlanList">
            <div class="text-center py-5 text-muted">
                <i class="fa-solid fa-spinner fa-spin fa-2x text-success mb-2"></i>
                <p class="small fw-bold">ভিআইপি প্ল্যান লোড হচ্ছে...</p>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation -->
    <div class="footer-nav">
        <a href="support.html" class="nav-item"><i class="fa-solid fa-headset"></i><span>Help</span></a>
        <a href="withdraw.html" class="nav-item"><i class="fa-solid fa-wallet"></i><span>Wallet</span></a>
        <div class="home-wrapper">
            <a href="dashboard.html" class="home-btn"><i class="fa-solid fa-house"></i></a>
        </div>
        <a href="referral_users.html" class="nav-item"><i class="fa-solid fa-users"></i><span>Team</span></a>
        <a href="settings.html" class="nav-item"><i class="fa-solid fa-circle-user"></i><span>Profile</span></a>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB3kKnSd54IuuBOCyVjzry47q002cMF-zA",
            authDomain: "bdt-php.firebaseapp.com",
            projectId: "bdt-php",
            storageBucket: "bdt-php.firebasestorage.app",
            messagingSenderId: "98854531594",
            appId: "1:98854531594:web:7a3801c1ae6a1817bbe5f3",
            measurementId: "G-VLCRVLP8YP"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let userBalance = 0;
        let isUserActive = false;

        // অথ স্টেট চেক
        auth.onAuthStateChanged(async (user) => {
            if(!user) {
                window.location.href = "login.html";
                return;
            }
            currentUser = user;
            loadUserData();
            loadVipPackages();
        });

        // ইউজার ডেটা রিয়েলটাইম লোড
        function loadUserData() {
            db.collection("users").doc(currentUser.uid).onSnapshot(snap => {
                if(snap.exists) {
                    const data = snap.data();
                    userBalance = parseFloat(data.balance || 0);
                    document.getElementById('uBalance').innerText = userBalance.toFixed(2);
                    isUserActive = ((data.status || '').toLowerCase() === 'active');

                    // চেক মেয়াদ শেষ কিনা
                    let isExpired = false;
                    if(data.vip_expiry_date) {
                        const expDate = data.vip_expiry_date.toDate ? data.vip_expiry_date.toDate() : new Date(data.vip_expiry_date);
                        if(new Date() > expDate) {
                            isExpired = true;
                        }
                    }

                    if(data.vip_plan && !isExpired) {
                        document.getElementById('curPlanName').innerText = data.vip_plan;
                        document.getElementById('curPlanStatus').innerText = "মেয়াদ বাকি: " + (data.vip_days_left || "সক্রিয় রয়েছে");
                        document.getElementById('planActionArea').innerHTML = `
                            <a href="vip_tasks.html" class="btn btn-warning btn-sm rounded-pill px-3 fw-bold shadow-sm">
                                <i class="fa-solid fa-play me-1"></i> টাস্ক শুরু করুন
                            </a>
                        `;
                    } else if(data.vip_plan && isExpired) {
                        document.getElementById('curPlanName').innerText = data.vip_plan + " (মেয়াদ শেষ)";
                        document.getElementById('curPlanStatus').innerText = "আপনার প্ল্যানের মেয়াদ শেষ হয়েছে";
                        document.getElementById('planActionArea').innerHTML = `<span class="badge bg-danger rounded-pill px-3 py-2 fw-bold">মেয়াদ উত্তীর্ণ</span>`;
                    } else {
                        document.getElementById('curPlanName').innerText = "Free Tier";
                        document.getElementById('curPlanStatus').innerText = "কোনো প্রিমিয়াম প্ল্যান সক্রিয় নেই";
                        document.getElementById('planActionArea').innerHTML = `<span class="badge bg-success bg-opacity-25 text-success border border-success border-opacity-25 rounded-pill px-3 py-2 fw-bold">ফ্রি মেম্বার</span>`;
                    }
                }
            });
        }

        // ফায়ারবেস থেকে লাইভ ভিআইপি প্যাকেজ লোড
        function loadVipPackages() {
            db.collection("vip_packages").onSnapshot(snapshot => {
                const container = document.getElementById('dynamicPlanList');
                container.innerHTML = "";

                if(snapshot.empty) {
                    container.innerHTML = `
                        <div class="card p-4 text-center border-0 rounded-4 shadow-sm mt-3">
                            <i class="fa-solid fa-gem text-muted fa-3x mb-2"></i>
                            <h6 class="fw-bold text-dark">বর্তমানে কোনো ভিআইপি প্ল্যান নেই</h6>
                            <p class="small text-muted mb-0">খুব শীঘ্রই নতুন প্ল্যান যুক্ত করা হবে।</p>
                        </div>
                    `;
                    return;
                }

                let activePackages = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if(data.status === 'active') {
                        activePackages.push({ id: doc.id, ...data });
                    }
                });

                // কম দাম থেকে বেশি দাম অনুযায়ী সাজানো
                activePackages.sort((a, b) => (Number(a.price) || 0) - (Number(b.price) || 0));

                if(activePackages.length === 0) {
                    container.innerHTML = `
                        <div class="card p-4 text-center border-0 rounded-4 shadow-sm mt-3">
                            <i class="fa-solid fa-gem text-muted fa-3x mb-2"></i>
                            <h6 class="fw-bold text-dark">বর্তমানে কোনো সক্রিয় ভিআইপি প্ল্যান নেই</h6>
                            <p class="small text-muted mb-0">খুব শীঘ্রই চালু করা হবে।</p>
                        </div>
                    `;
                    return;
                }

                activePackages.forEach(p => {
                    const safeName = (p.name || '').replace(/'/g, "\\'");
                    const safePrice = Number(p.price) || 0;
                    const safeDays = Number(p.days) || 1;
                    
                    // সংখ্যা নিষ্কাশন
                    const dailyInc = parseFloat(String(p.dailyIncome || 0).replace(/[^0-9.]/g, '')) || 0;
                    const dailyTasks = parseInt(String(p.dailyTasks || 1).replace(/[^0-9]/g, '')) || 1;

                    // থিম ও কালার ক্লাস নির্ধারণ
                    let themeClass = p.themeColor || 'indigo';
                    let iconColor = "text-indigo-500";
                    let headerIcon = "fa-shield-halved";

                    if(themeClass === 'gold') {
                        iconColor = "text-warning";
                        headerIcon = "fa-medal";
                    } else if(themeClass === 'rose') {
                        iconColor = "text-danger";
                        headerIcon = "fa-gem";
                    } else if(themeClass === 'emerald') {
                        iconColor = "text-success";
                        headerIcon = "fa-crown";
                    }

                    container.innerHTML += `
                        <div class="plan-card">
                            <span class="plan-badge badge-${themeClass}">${p.badge || 'VIP'}</span>
                            <div class="plan-header">
                                <i class="fa-solid ${headerIcon} ${iconColor}"></i>
                                <h5>${p.name}</h5>
                            </div>
                            <div class="plan-price">৳ ${p.price} <span>/ ${p.days} দিন</span></div>
                            <ul class="feature-list">
                                <li><i class="fa-solid fa-circle-check text-success"></i> দৈনিক ইনকাম: ৳ ${dailyInc}</li>
                                <li><i class="fa-solid fa-circle-check text-success"></i> দৈনিক টাস্ক লিমিট: ${dailyTasks} টি</li>
                                <li><i class="fa-solid fa-circle-check text-success"></i> প্রতি টাস্কের আয়: ৳ ${(dailyTasks > 0 ? (dailyInc / dailyTasks).toFixed(2) : dailyInc)}</li>
                                <li><i class="fa-solid fa-circle-check text-success"></i> ${p.extraBenefit || 'বিশেষ সুবিধা অন্তর্ভুক্ত'}</li>
                                <li><i class="fa-solid fa-circle-check text-success"></i> মেয়াদ: ${p.days} দিন</li>
                            </ul>
                            <button class="btn-upgrade btn-${themeClass}" onclick="buyPlan('${safeName}', ${safePrice}, ${safeDays}, ${dailyInc}, ${dailyTasks})">
                                <i class="fa-solid fa-bolt"></i> আনলক করুন (৳ ${p.price})
                            </button>
                        </div>
                    `;
                });
            }, err => {
                document.getElementById('dynamicPlanList').innerHTML = `<div class="alert alert-danger text-center rounded-4 small">সমস্যা হয়েছে: ${err.message}</div>`;
            });
        }

        // প্ল্যান ক্রয় হ্যান্ডলার
        async function buyPlan(planName, price, days, dailyIncome, dailyTasks) {
            // ১. একাউন্ট একটিভ কিনা চেক
            if(!isUserActive) {
                Swal.fire({
                    icon: 'warning',
                    title: 'একাউন্ট একটিভ নয়!',
                    text: 'ভিআইপি প্ল্যান ক্রয় করতে হলে আগে আপনার একাউন্ট একটিভ করতে হবে।',
                    confirmButtonText: '<i class="fa-solid fa-bolt me-1"></i> Active Now',
                    confirmButtonColor: '#ff4b2b',
                    showCancelButton: true,
                    cancelButtonText: 'বাতিল'
                }).then((res) => {
                    if(res.isConfirmed) {
                        window.location.href = 'activate_account.html';
                    }
                });
                return;
            }

            // ২. ব্যালেন্স চেক
            if(userBalance < price) {
                Swal.fire({
                    icon: 'error',
                    title: 'অপর্যাপ্ত ব্যালেন্স!',
                    text: `${planName} কিনতে আপনার ব্যালেন্সে ৳ ${price} প্রয়োজন। দয়া করে পর্যাপ্ত ডিপোজিট করুন।`,
                    confirmButtonText: 'ডিপোজিট করুন',
                    confirmButtonColor: '#00b894',
                    showCancelButton: true,
                    cancelButtonText: 'বাতিল'
                }).then((res) => {
                    if(res.isConfirmed) {
                        window.location.href = 'deposit.html';
                    }
                });
                return;
            }

            // প্রতি টাস্কের স্বয়ংক্রিয় মূল্য হিসাব (দৈনিক ইনকাম / দৈনিক টাস্ক)
            const taskRate = dailyTasks > 0 ? parseFloat((dailyIncome / dailyTasks).toFixed(4)) : dailyIncome;

            // ৩. নিশ্চিতকরণ ডায়ালগ
            const result = await Swal.fire({
                title: 'প্ল্যান নিশ্চিতকরণ',
                html: `
                    <div class="text-start small p-2 bg-light rounded-3">
                        <p class="mb-1"><strong>প্যাকেজ:</strong> ${planName}</p>
                        <p class="mb-1"><strong>মূল্য:</strong> ৳ ${price}</p>
                        <p class="mb-1"><strong>দৈনিক ইনকাম:</strong> ৳ ${dailyIncome}</p>
                        <p class="mb-1"><strong>দৈনিক টাস্ক:</strong> ${dailyTasks} টি</p>
                        <p class="mb-0 text-success"><strong>প্রতি টাস্কে পাবেন:</strong> ৳ ${taskRate.toFixed(2)}</p>
                    </div>
                    <p class="mt-2 mb-0">আপনি কি নিশ্চিত এই প্ল্যানটি কিনতে চান?</p>
                `,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'হ্যাঁ, কিনুন',
                cancelButtonText: 'বাতিল',
                confirmButtonColor: '#00b894'
            });

            if(result.isConfirmed) {
                try {
                    Swal.fire({
                        title: 'প্রসেসিং হচ্ছে...',
                        text: 'অনুগ্রহ করে অপেক্ষা করুন',
                        allowOutsideClick: false,
                        didOpen: () => { Swal.showLoading(); }
                    });

                    // মেয়াদ শেষ হওয়ার তারিখ হিসাব
                    const expiryDate = new Date();
                    expiryDate.setDate(expiryDate.getDate() + Number(days));

                    // ইউজার ব্যালেন্স থেকে টাকা কাটা ও প্ল্যান ডেটা সেভ
                    await db.collection("users").doc(currentUser.uid).update({
                        balance: firebase.firestore.FieldValue.increment(-price),
                        vip_plan: planName,
                        vip_price: price,
                        vip_days: days,
                        vip_daily_income: dailyIncome,
                        vip_daily_tasks: dailyTasks,
                        vip_task_rate: taskRate,
                        vip_tasks_today: 0,
                        vip_last_task_date: "",
                        vip_purchase_date: firebase.firestore.FieldValue.serverTimestamp(),
                        vip_expiry_date: firebase.firestore.Timestamp.fromDate(expiryDate),
                        vip_days_left: days + " দিন"
                    });

                    // ট্রানজ্যাকশন হিস্ট্রি রেকর্ড যোগ
                    await db.collection("vip_orders").add({
                        userId: currentUser.uid,
                        plan: planName,
                        amount: price,
                        daily_income: dailyIncome,
                        daily_tasks: dailyTasks,
                        task_rate: taskRate,
                        validity_days: days,
                        status: "approved",
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    Swal.fire({
                        icon: 'success',
                        title: 'অভিনন্দন!',
                        text: `আপনার "${planName}" সফলভাবে সক্রিয় হয়েছে! টাস্ক পেইজে নিয়ে যাওয়া হচ্ছে...`,
                        timer: 2000,
                        showConfirmButton: false
                    }).then(() => {
                        // কেনার পর সরাসরি টাস্ক ফাইলে নিয়ে যাবে
                        window.location.href = "vip_tasks.html";
                    });

                } catch(err) {
                    Swal.fire('Error', 'সমস্যা হয়েছে: ' + err.message, 'error');
                }
            }
        }
    </script>
</body>
</html>
