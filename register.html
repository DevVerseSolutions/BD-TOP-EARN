<!DOCTYPE html>  
<html lang="bn">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Register | Unique Earn</title>  
    <script src="https://cdn.tailwindcss.com"></script>  
    <link href="https://fonts.googleapis.com/css2?family=Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  
    <style>  
        body { font-family: 'Jakarta Sans', sans-serif; background-color: #f1f5f9; color: #334155; }  
        .app-input { transition: all 0.2s; border: 1px solid #e2e8f0; background: #fff; }  
        .app-input:focus { border-color: #00a0e9; background: #fff; ring: none; outline: none; }  
        .btn-flat { background: #00a0e9; color: #fff; transition: all 0.2s; border: none; }  
        .btn-flat:active { transform: scale(0.97); background: #008cc9; }  
        .flat-alert { padding: 10px 15px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 15px; text-align: center; }  
        .alert-red { background-color: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }  
        .alert-yellow { background-color: #fffbeb; border: 1px solid #fef3c7; color: #a16207; }  
        .animate-fade-up { animation: fadeUp 0.4s ease-out; }  
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }  
    </style>  
</head>  
<body class="flex flex-col items-center justify-start min-h-screen pt-10 px-4 pb-10">  
<div class="flex bg-white p-1 rounded-full w-full max-w-[300px] mb-6 shadow-sm border border-gray-100 animate-fade-up">  
    <a href="login.html" class="flex-1 py-2 text-slate-500 font-semibold text-xs text-center rounded-full transition-all">Log In</a>  
    <button class="flex-1 py-2 bg-[#00a0e9] text-white font-bold text-xs rounded-full transition-all">Sign Up</button>  
</div>  

<div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-sm border border-gray-100 animate-fade-up" style="animation-delay: 0.1s;">  
    <div class="text-center mb-6">  
        <div class="h-12 w-12 bg-slate-100 text-[#00a0e9] rounded-xl flex items-center justify-center text-xl mx-auto mb-3"><i class="fas fa-user-plus"></i></div>  
        <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">Create Account</h1>  
        <p class="text-slate-400 text-xs mt-0.5">Join BD TOP EARN today</p>  
    </div>  

    <div id="msgBox" class="hidden"></div>
              
    <form id="registerForm" class="space-y-3.5">  
        <div class="relative group">  
            <input type="text" id="referral_id" placeholder="Referral ID (Optional)"   
                   class="w-full app-input rounded-xl py-3 px-4 pl-10 text-slate-700 font-medium text-sm placeholder:text-slate-400">  
            <i class="fas fa-gift absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-[#00a0e9] text-sm transition-colors"></i>  
        </div>  

        <div class="relative group">  
            <input type="text" id="fullname" placeholder="Full Name" required  
                   class="w-full app-input rounded-xl py-3 px-4 pl-10 text-slate-700 font-medium text-sm placeholder:text-slate-400">  
            <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-[#00a0e9] text-sm transition-colors"></i>  
        </div>  

        <div class="relative group">  
            <input type="email" id="email" placeholder="Email Address" required  
                   class="w-full app-input rounded-xl py-3 px-4 pl-10 text-slate-700 font-medium text-sm placeholder:text-slate-400">  
            <i class="far fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-[#00a0e9] text-sm transition-colors"></i>  
        </div>  

        <div class="relative group">  
            <input type="password" id="password" placeholder="Password" required minlength="6"  
                   class="w-full app-input rounded-xl py-3 px-4 pl-10 pr-10 text-slate-700 font-medium text-sm placeholder:text-slate-400">  
            <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-[#00a0e9] text-sm transition-colors"></i>  
            <button type="button" id="togglePassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-[#00a0e9] focus:outline-none text-xs transition-colors">  
                <i class="fas fa-eye"></i>  
            </button>  
        </div>  

        <div class="relative group">  
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required  
                   class="w-full app-input rounded-xl py-3 px-4 pl-10 pr-10 text-slate-700 font-medium text-sm placeholder:text-slate-400">  
            <i class="fas fa-check-double absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-[#00a0e9] text-sm transition-colors"></i>  
            <div class="absolute right-4 top-1/2 -translate-y-1/2 text-xs" id="confirmMessage"></div>  
        </div>  

        <button type="submit" id="regBtn" class="w-full btn-flat font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 mt-3 text-sm tracking-wide">  
            <span>Create Account</span>  
            <i class="fas fa-arrow-right text-xs"></i>  
        </button>  
    </form>  

    <div class="mt-6 text-center">  
        <p class="text-slate-400 text-xs font-medium">Already have an account?   
            <a href="login.html" class="text-[#00a0e9] font-bold hover:text-[#008cc9] transition-colors ml-1">Login here</a>  
        </p>  
    </div>  
</div>  

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>
    const firebaseConfig = {
  apiKey: "AIzaSyB3kKnSd54IuuBOCyVjzry47q002cMF-zA",
  authDomain: "bdt-php.firebaseapp.com",
  projectId: "bdt-php",
  storageBucket: "bdt-php.firebasestorage.app",
  messagingSenderId: "98854531594",
  appId: "1:98854531594:web:7a3801c1ae6a1817bbe5f3",
  measurementId: "G-VLCRVLP8YP"
};
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.get('ref')) {
        document.getElementById('referral_id').value = urlParams.get('ref');
    }

    const togglePassword = document.getElementById('togglePassword');  
    const passwordInput = document.getElementById('password');  
    const confirmPasswordInput = document.getElementById('confirmPassword');  
    const confirmMessage = document.getElementById('confirmMessage');  
    const msgBox = document.getElementById('msgBox');

    togglePassword.addEventListener('click', function() {  
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';  
        passwordInput.setAttribute('type', type);  
        this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash text-[#00a0e9]"></i>';  
    });  

    confirmPasswordInput.addEventListener('input', function() {  
        if(this.value === passwordInput.value && this.value !== '') {  
            confirmMessage.innerHTML = '<i class="fas fa-check-circle text-green-500"></i>';  
            this.style.borderColor = "#10b981";  
        } else if(this.value !== '') {  
            confirmMessage.innerHTML = '<i class="fas fa-times-circle text-red-400"></i>';  
            this.style.borderColor = "#f87171";  
        } else {  
            confirmMessage.innerHTML = '';  
            this.style.borderColor = "#e2e8f0";  
        }  
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fullname = document.getElementById('fullname').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const refId = document.getElementById('referral_id').value.trim();

        if (password !== confirmPassword) {
            msgBox.className = "flat-alert alert-yellow";
            msgBox.innerText = "⚠️ পাসওয়ার্ড মিলছে না!";
            return;
        }

        const regBtn = document.getElementById('regBtn');
        regBtn.disabled = true;
        regBtn.innerText = "Creating Account...";

        try {
            const userCred = await auth.createUserWithEmailAndPassword(email, password);
            const uid = userCred.user.uid;

            await db.collection("users").doc(uid).set({
                id: uid,
                fullname: fullname,
                email: email,
                balance: 0.00,
                status: "inactive",
                referral_income: 0.00,
                referral_count: 0,
                referred_by_id: refId || "",
                profile_pic: "",
                created_at: firebase.firestore.FieldValue.serverTimestamp()
            });

            window.location.href = "dashboard.html";
        } catch(err) {
            msgBox.className = "flat-alert alert-red";
            msgBox.innerText = "❌ " + (err.message || "নিবন্ধনে সমস্যা হয়েছে।");
            regBtn.disabled = false;
            regBtn.innerText = "Create Account";
        }
    });
</script>
</body>
</html>
