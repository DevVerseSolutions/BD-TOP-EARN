<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Team | BD TOP EARN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00b894;
            --secondary: #00897b;
            --team-gradient: linear-gradient(135deg, #0984e3, #6c5ce7);
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 20px 15px 40px;
            color: #334155;
        }
        .main-container {
            max-width: 480px;
            margin: 0 auto;
        }

        /* Top Header */
        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .btn-back {
            width: 40px;
            height: 40px;
            background: #fff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            border: 1px solid #e2e8f0;
            transition: 0.2s;
        }
        .btn-back:hover { background: #f8fafc; }

        /* Team Overview Card */
        .team-banner {
            background: var(--team-gradient);
            border-radius: 20px;
            padding: 22px 20px;
            color: white;
            box-shadow: 0 10px 25px rgba(108, 92, 231, 0.25);
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .team-banner::after {
            content: "";
            position: absolute;
            right: -20px;
            bottom: -30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }
        .team-title { font-size: 13px; font-weight: 600; opacity: 0.9; text-transform: uppercase; letter-spacing: 0.5px; }
        .team-count { font-size: 32px; font-weight: 800; margin: 2px 0 0; }
        .team-icon-box {
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            backdrop-filter: blur(5px);
        }

        /* Generation Card */
        .gen-container-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 5px 20px rgba(0,0,0,0.03);
            margin-bottom: 20px;
        }
        .gen-heading {
            font-size: 14px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .level-row {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.2s;
        }
        .level-row:last-child { margin-bottom: 0; }
        .level-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .lvl-badge {
            width: 38px;
            height: 38px;
            background: #e0f2fe;
            color: #0369a1;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
        }
        .lvl-info h6 { font-size: 14px; font-weight: 800; margin: 0; color: #1e293b; }
        .lvl-info span { font-size: 12px; font-weight: 600; color: #64748b; }
        
        .btn-view-member {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-view-member:active { transform: scale(0.95); }

        /* Modal Styles */
        .modal-content {
            border-radius: 24px;
            border: none;
            overflow: hidden;
        }
        .modal-header {
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 16px 20px;
        }
        .modal-body {
            max-height: 480px;
            overflow-y: auto;
            padding: 15px;
            background: #f8fafc;
        }

        /* Member Item */
        .member-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .m-name { font-size: 13px; font-weight: 800; color: #1e293b; margin: 0; }
        .m-time { font-size: 10px; color: #94a3b8; margin-top: 2px; }
        .st-badge {
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 50px;
        }
        .st-active { background: #dcfce7; color: #15803d; }
        .st-inactive { background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>

<div class="main-container">

    <!-- Top Header -->
    <div class="top-header">
        <a href="dashboard.html" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h6 class="m-0 fw-bold fs-5">আমার টিম (My Team)</h6>
        <div style="width: 40px;"></div>
    </div>

    <!-- Team Overview Card -->
    <div class="team-banner">
        <div>
            <div class="team-title">মোট টিম মেম্বার</div>
            <div class="team-count" id="teamCount">0</div>
        </div>
        <div class="team-icon-box">
            <i class="fa-solid fa-users"></i>
        </div>
    </div>

    <!-- Generation Levels Container -->
    <div class="gen-container-card">
        <div class="gen-heading">
            <i class="fa-solid fa-sitemap text-primary"></i>
            <span>জেনারেশন লেভেল সমূহ (Generations)</span>
        </div>

        <!-- Level 1 (Direct Referrals) -->
        <div class="level-row">
            <div class="level-left">
                <div class="lvl-badge">LV-1</div>
                <div class="lvl-info">
                    <h6>Generation LV~1</h6>
                    <span id="lv1Count">(0 মেম্বার)</span>
                </div>
            </div>
            <button type="button" class="btn-view-member" data-bs-toggle="modal" data-bs-target="#teamModal" onclick="loadLevelMembers(1)">
                View
            </button>
        </div>

        <!-- Level 2 -->
        <div class="level-row">
            <div class="level-left">
                <div class="lvl-badge">LV-2</div>
                <div class="lvl-info">
                    <h6>Generation LV~2</h6>
                    <span>(0 মেম্বার)</span>
                </div>
            </div>
            <button type="button" class="btn-view-member" data-bs-toggle="modal" data-bs-target="#teamModal" onclick="loadLevelMembers(2)">
                View
            </button>
        </div>

        <!-- Level 3 -->
        <div class="level-row">
            <div class="level-left">
                <div class="lvl-badge">LV-3</div>
                <div class="lvl-info">
                    <h6>Generation LV~3</h6>
                    <span>(0 মেম্বার)</span>
                </div>
            </div>
            <button type="button" class="btn-view-member" data-bs-toggle="modal" data-bs-target="#teamModal" onclick="loadLevelMembers(3)">
                View
            </button>
        </div>

        <!-- Level 4 -->
        <div class="level-row">
            <div class="level-left">
                <div class="lvl-badge">LV-4</div>
                <div class="lvl-info">
                    <h6>Generation LV~4</h6>
                    <span>(0 মেম্বার)</span>
                </div>
            </div>
            <button type="button" class="btn-view-member" data-bs-toggle="modal" data-bs-target="#teamModal" onclick="loadLevelMembers(4)">
                View
            </button>
        </div>
    </div>

    <!-- Back to Refer -->
    <div class="text-center mt-3">
        <a href="refer.html" class="text-decoration-none text-primary small fw-bold">
            <i class="fa-solid fa-plus-circle me-1"></i> নতুন মেম্বার রেফার করুন
        </a>
    </div>

</div>

<!-- Team Members Popup Modal -->
<div class="modal fade" id="teamModal" tabindex="-1" aria-labelledby="teamModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title fw-bold" id="teamModalLabel">
                    <i class="fa-solid fa-users text-primary me-2"></i><span id="modalLevelTitle">Generation LV~1</span>
                </h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="memberList">
                <div class="text-center text-muted py-4">
                    <div class="spinner-border text-primary spinner-border-sm mb-2" role="status"></div>
                    <p class="small mb-0">মেম্বার তথ্য লোড হচ্ছে...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Firebase & Script -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB3kKnSd54IuuBOCyVjzry47q002cMF-zA",
        authDomain: "bdt-php.firebaseapp.com",
        projectId: "bdt-php",
        storageBucket: "bdt-php.firebasestorage.app",
        messagingSenderId: "98854531594",
        appId: "1:98854531594:web:7a3801c1ae6a1817bbe5f3",
        measurementId: "G-VLCRVLP8YP"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUserId = null;
    let myReferralCode = null;

    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            window.location.href = "login.html";
            return;
        }
        currentUserId = user.uid;

        // ইউজারের রেফার কোড চেক
        const uSnap = await db.collection("users").doc(user.uid).get();
        const uData = uSnap.data() || {};
        myReferralCode = uData.refer_code || uData.my_refer_code || user.uid;

        // লেভেল ১ রেফারেল লোড
        try {
            const snap = await db.collection("users")
                                 .where("referred_by", "in", [user.uid, myReferralCode])
                                 .get();

            const count = snap.size;
            document.getElementById('teamCount').innerText = count;
            document.getElementById('lv1Count').innerText = `(${count} মেম্বার)`;
        } catch (e) {
            console.error("Team count error:", e);
        }
    });

    // মডালে মেম্বার লিস্ট দেখানো
    async function loadLevelMembers(level) {
        document.getElementById('modalLevelTitle').innerText = `Generation LV~${level} মেম্বারগণ`;
        const listContainer = document.getElementById('memberList');
        
        listContainer.innerHTML = `
            <div class="text-center text-muted py-4">
                <div class="spinner-border text-primary spinner-border-sm mb-2" role="status"></div>
                <p class="small mb-0">মেম্বার তথ্য লোড হচ্ছে...</p>
            </div>`;

        if (level > 1) {
            // লেভেল ২, ৩, ৪ খালি থাকলে ফ্রেন্ডলি বার্তা
            listContainer.innerHTML = `
                <div class="text-center text-muted py-5">
                    <i class="fa-solid fa-user-group fa-2x mb-2 opacity-50"></i>
                    <p class="fw-bold mb-0">Generation LV~${level}-এ কোনো মেম্বার নেই</p>
                    <small>আপনার লেভেল ১ এর মেম্বাররা অন্যদের রেফার করলে এখানে দেখতে পাবেন।</small>
                </div>`;
            return;
        }

        try {
            const snap = await db.collection("users")
                                 .where("referred_by", "in", [currentUserId, myReferralCode])
                                 .get();

            if (snap.empty) {
                listContainer.innerHTML = `
                    <div class="text-center text-muted py-5">
                        <i class="fa-solid fa-users fa-3x mb-3 text-secondary opacity-50"></i>
                        <p class="fw-bold mb-0">কোনো রেফার মেম্বার পাওয়া যায়নি!</p>
                        <small>বন্ধুদের রেফার করে আপনার টিম তৈরি করুন।</small>
                    </div>`;
                return;
            }

            let html = "";
            snap.forEach(doc => {
                const data = doc.data();
                const status = (data.status || 'inactive').toLowerCase();
                const isActive = status === 'active';
                const stBadge = isActive 
                    ? `<span class="st-badge st-active">● Active</span>` 
                    : `<span class="st-badge st-inactive">● Inactive</span>`;

                const name = data.fullname || data.name || "User";
                const phone = data.phone ? (data.phone.substring(0, 5) + "****" + data.phone.substring(9)) : "Member";

                html += `
                <div class="member-card">
                    <div>
                        <h6 class="m-name"><i class="fa-regular fa-circle-user text-primary me-1"></i> ${name}</h6>
                        <div class="m-time">${phone}</div>
                    </div>
                    <div>
                        ${stBadge}
                    </div>
                </div>`;
            });

            listContainer.innerHTML = html;

        } catch (err) {
            listContainer.innerHTML = `<p class="text-center text-danger small py-3">মেম্বার লোড করতে সমস্যা হয়েছে।</p>`;
        }
    }
</script>
</body>
</html>
